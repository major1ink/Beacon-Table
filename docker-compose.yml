# Запуск одной командой: docker compose up -d
#
# Настройки — через environment ниже либо через файл: раскомментируйте
# env_file и положите рядом beacon.conf (формат тот же, что и у файла,
# который приложение создаёт рядом с собой при первом запуске).
services:
  beacon-table:
    build: .
    # Готовый образ вместо сборки из исходников:
    # image: ghcr.io/major1ink/beacon-table:latest
    restart: unless-stopped
    ports:
      # Порт наружу. С прокси-сервисом ниже закройте его от внешней сети,
      # оставив доступ только контейнеру Caddy: "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      # Стол за HTTPS-прокси — включает Secure у cookie. Без прокси (просто
      # локальная сеть) оставьте false, иначе войти не получится.
      BEACON_BEHIND_PROXY: "false"
    # env_file:
    #   - beacon.conf
    volumes:
      # База, журнал, сцены, заметки.
      - beacon-data:/data
      # Карты, токены, аудио.
      - beacon-uploads:/uploads

  # HTTPS-прокси. Раскомментируйте весь блок, впишите домен и почту в
  # deploy/Caddyfile.example, и поставьте выше BEACON_BEHIND_PROXY: "true"
  # и порт "127.0.0.1:8080:8080".
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - beacon-table

volumes:
  beacon-data:
  beacon-uploads:
  # caddy-data:
  # caddy-config:
