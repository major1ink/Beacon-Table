# Локальный тестовый прогон (без публикации, без тега):
#   goreleaser release --snapshot --clean
#
# Документация: https://goreleaser.com/customization/
version: 2

builds:
  - id: beacon-table
    main: ./cmd/beacon-table
    binary: beacon-table
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: beacon-table
    formats: ["binary"]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - none*

checksum:
  name_template: "checksums.txt"

# Заметки к версии пишутся руками: docs/releases/<тег>.md, workflow подставляет их в релиз.
changelog:
  disable: true

release:
  name_template: "Beacon Table {{ .Version }}"
