# Локальный тестовый прогон (без публикации, без тега):
#   goreleaser release --snapshot --clean
#
# Документация: https://goreleaser.com/customization/
version: 2

builds:
  - id: beacon-table
    main: ./cmd/beacon-table
    binary: beacon-table
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows на ARM сама запускает amd64 через эмуляцию — отдельная
      # сборка только добавляла строчку выбора на странице загрузки.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Один файл для Mac на Intel и на Apple Silicon: человеку не нужно
# выяснять, какой у него процессор.
universal_binaries:
  - id: beacon-table
    replace: true

archives:
  - id: beacon-table
    formats: ["binary"]
    # У универсальной сборки Arch — "all"; в имени файла понятнее universal.
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - none*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

release:
  name_template: "Beacon Table {{ .Version }}"
