<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Вход</title>
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }

    /* Заставка на весь экран (public/splash.svg — вектор, поэтому cover не
       мылит на больших экранах). position: fixed + inset: 0, а не background
       у body: карточка входа лежит выше по z-index и ничего не наследует от
       фона. Заменить картинку = положить свой файл вместо web/public/splash.svg. */
    #splash {
      position: fixed; inset: 0; z-index: 0;
      /* 30%, а не center: заставка 16:9, и на портретном экране cover режет её
         по бокам — при центрировании маяк уезжает за кадр целиком. 30% —
         крайняя точка, при которой маяк целиком остаётся в кадре даже на
         узком телефоне (390×844); на экранах шире 16:9 обрезки по горизонтали
         нет вовсе, так что смещение там ни на что не влияет. */
      background: var(--bg) url("/splash.svg") 30% center / cover no-repeat;
    }
    #box { position: relative; z-index: 1; }

    /* Версия сервера (GET /api/version, см. cmd/beacon-table/version.go) — в
       углу поверх заставки, а не внутри карточки: служебная подпись не должна
       разрывать блок «вход/регистрация». Пустой, пока ответ не пришёл —
       поэтому без плейсхолдера в разметке. */
    #appVersion {
      position: fixed; z-index: 1; right: 12px; bottom: 10px;
      font-size: 11px; letter-spacing: 0.02em; color: var(--text-dim);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    #box {
      background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 28px 30px; width: 300px;
      max-width: calc(100vw - 40px); box-shadow: var(--shadow-float);
    }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    #subtitle { text-align: center; opacity: 0.6; font-size: 12px; margin-bottom: 18px; }

    #tabs { display: flex; margin-bottom: 18px; border-radius: var(--radius-pill); overflow: hidden; background: var(--surface); padding: 3px; gap: 2px; }
    #tabs button {
      flex: 1 1 0; padding: 8px; border: none; background: none; border-radius: var(--radius-pill); color: var(--text-dim);
      cursor: pointer; font: inherit; font-size: 13px; transition: background .12s ease, color .12s ease;
    }
    #tabs button.active { background: var(--accent-bg); color: var(--accent); }

    form { display: none; }
    form.active { display: block; }
    label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
    input {
      width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); padding: 9px; margin-bottom: 14px; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] {
      width: 100%; padding: 10px; border: none; border-radius: var(--radius); background: var(--green);
      color: #fff; font-size: 14px; cursor: pointer; transition: background .12s ease;
    }
    button[type="submit"]:hover { background: var(--green-hover); }
    .msg { font-size: 12px; margin-top: 10px; min-height: 14px; }
    .msg.error { color: #e74c3c; }
    .msg.ok { color: var(--green-bright); }
  </style>
  <script type="module" crossorigin src="/assets/index-C9B8ey6K.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-D5p_uwOr.js">
  <link rel="stylesheet" crossorigin href="/assets/api-rS-ciWvP.css">
</head>
<body>
  <div id="splash"></div>

  <div id="box">
    <h1>Beacon Table</h1>
    <div id="subtitle">стол для НРИ — локально и через интернет</div>

    <!-- worldWait — залогиненный игрок, но ДМ сейчас ведёт другой мир (или
         вообще ни один не запущен), см. web/src/pages/index.js. Вместо
         редиректа на player.html показываем это и даём выйти. -->
    <div id="worldWait" style="display:none;">
      <p id="worldWaitMsg" style="font-size: 13px; line-height: 1.5; opacity: 0.85; margin: 0 0 16px;"></p>
      <button id="worldWaitLogout" type="button" style="width:100%; padding:10px; border:none; border-radius:var(--radius); background:var(--surface); color:var(--text); font-size:14px; cursor:pointer;">Выйти</button>
    </div>

    <div id="tabs">
      <button id="tabLoginBtn" class="active">Вход</button>
      <button id="tabRegisterBtn">Регистрация</button>
    </div>

    <form id="loginForm" class="active">
      <label for="loginUsername">Логин</label>
      <input type="text" id="loginUsername" autocomplete="username" required />
      <label for="loginPassword">Пароль</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required />
      <button type="submit">Войти</button>
      <div id="loginMsg" class="msg"></div>
    </form>

    <form id="registerForm">
      <label for="regUsername">Логин</label>
      <input type="text" id="regUsername" autocomplete="username" required />
      <label for="regPassword">Пароль</label>
      <input type="password" id="regPassword" autocomplete="new-password" required />
      <button type="submit">Зарегистрироваться</button>
      <div id="registerMsg" class="msg"></div>
    </form>
  </div>

  <div id="appVersion"></div>

</body>
</html>
