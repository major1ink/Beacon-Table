  <title>Beacon Table — Трансляция</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #canvasWrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; background: #333; }

    /* ---- HUD зума/полноэкранного режима — тот же стиль плавающей
       пилюли, что и у ДМ (см. web/dm.html: #zoomHud), но средняя кнопка
       тут переключает НАСТОЯЩИЙ полноэкранный режим (Fullscreen API), а
       не просто сброс камеры — на ТВ/проекторе это и есть "на весь
       экран", в отличие от окна ДМ/игрока, где это лишь вписывает карту
       в канвас (см. web/src/pages/broadcast.js). ---- */
    #zoomHud {
      position: absolute; right: 10px; bottom: 10px; z-index: 5;
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
      border-radius: var(--radius-pill); padding: 4px; display: flex; gap: 4px;
    }
    #zoomHud button {
      cursor: pointer; width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%;
      background: var(--surface); color: var(--text); font: inherit; transition: background .12s ease;
      display: flex; align-items: center; justify-content: center;
    }
    #zoomHud button svg { flex: 0 0 auto; }
    #zoomHud button:hover { background: var(--surface-hover); }
    #zoomHud button.active { background: #e74c3c; }
  </style>
