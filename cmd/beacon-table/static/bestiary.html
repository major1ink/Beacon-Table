<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Бестиарий</title>
  <style>
    /* Та же палитра/база, что character-sheet.html — единая "бумага" для карточек. */
    :root { --radius: 8px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12.5px; display: flex; flex-direction: column;
    }
    button { cursor: pointer; border: none; border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
    button:hover { background: var(--surface-hover); }
    input, textarea, select {
      background: var(--panel-bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; padding: 4px 6px; font: inherit; width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    input[type="number"] { width: 100%; }
    label.field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-dim); }
    label.field > span { padding-left: 1px; }
    textarea { resize: vertical; min-height: 60px; font-family: inherit; line-height: 1.4; }

    #topBar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      border-bottom: 1px solid var(--border); background: var(--panel-bg); flex-wrap: wrap;
    }
    #monsterTitle { font-weight: 700; font-size: 15px; margin-right: auto; }
    #saveStatus { font-size: 11px; color: var(--text-dim); min-width: 90px; text-align: right; }
    #saveStatus.saving { color: var(--amber); }
    #saveStatus.error { color: #e74c3c; }
    #closeBtn, #editToggleBtn, #deleteBtn { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; }
    #editToggleBtn.active { background: var(--accent); color: #fff; }
    #deleteBtn:hover { background: var(--danger); color: #fff; }
    /* .sys-pill/#cloneBtn — карточка каталога "из коробки" (domain.Monster.
       System, см. internal/repository/monsterfile/system.go): вместо ✎ —
       бейдж "только чтение" и кнопка "Клонировать" (см. bestiary.js: boot). */
    .sys-pill { font-size: 10.5px; color: var(--amber); background: rgba(165,115,15,0.16); border-radius: var(--radius-pill); padding: 3px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    #cloneBtn { display: none; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; white-space: nowrap; }
    #cloneBtn.visible { display: inline-flex; }

    #loadingHint { padding: 24px; opacity: 0.6; }
    #app { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: none; padding: 16px; }
    #app.ready { display: block; }

    .section {
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; margin-bottom: 10px;
    }
    .section > h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 120px; }
    .grid-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; align-items: start; }
    .col { display: flex; flex-direction: column; }

    .computed {
      display: inline-flex; align-items: center; justify-content: center; min-width: 34px; padding: 3px 6px;
      background: var(--surface); border-radius: 5px; font-weight: 700; font-size: 12px;
    }
    .computed-lbl { font-size: 10px; color: var(--text-dim); margin-right: 4px; }
    .roll-btn { padding: 2px 6px; font-size: 12px; line-height: 1; background: var(--accent-bg); color: var(--accent); }
    .roll-btn:hover { background: var(--accent); color: #fff; }

    .ability-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .ability-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; background: var(--surface); text-align: center; }
    .ability-box .ability-name { font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; display: block; }
    .ability-box input[type="number"] { text-align: center; margin-bottom: 4px; }
    .ability-box .ability-actions { display: flex; align-items: center; justify-content: center; gap: 4px; }

    .portrait-wrap { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .portrait-img { width: 96px; height: 96px; object-fit: cover; border-radius: var(--radius); background: var(--surface); display: block; flex: 0 0 auto; }
    .portrait-placeholder { width: 96px; height: 96px; border-radius: var(--radius); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; text-align: center; flex: 0 0 auto; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 12px; padding: 2px 8px 2px 10px; font-size: 11px; }
    .tag-pill button { background: none; padding: 0 2px; color: var(--text-dim); }
    .tag-pill button:hover { color: #fff; background: var(--danger); border-radius: 50%; }

    .spell-ref-list { display: flex; flex-direction: column; gap: 4px; }
    .spell-ref-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 6px; padding: 4px 8px; }
    .spell-ref-name { flex: 1 1 auto; font-size: 12.5px; }
    .spell-ref-name.clickable { cursor: pointer; color: var(--accent); }
    .spell-ref-name.clickable:hover { text-decoration: underline; }
    .spell-ref-level { flex: 0 0 auto; font-size: 10px; opacity: 0.6; background: var(--bg); border-radius: 8px; padding: 1px 6px; }
    .spell-ref-row button { padding: 2px 7px; font-size: 11px; color: var(--text-dim); }
    .spell-ref-row button:hover { color: #fff; background: var(--danger); }
    /* ---- инвентарь (лут) монстра — переиспользует .spell-ref-* выше, свой
       только аватар предмета, см. pages/bestiary.js: invSection ---- */
    .inv-avatar { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 5px; background: var(--bg) center/cover no-repeat; }

    /* импорт из TTG Club */
    .hint { font-size: 11px; opacity: 0.65; margin: 0 0 8px; line-height: 1.5; }
    #importMsg { font-size: 11px; margin-top: 6px; min-height: 14px; }
    #importMsg.error { color: #e74c3c; }
    #importMsg.ok { color: #6fbf73; }
    #importTextarea { min-height: 70px; font-family: monospace; font-size: 11px; margin-top: 6px; width: 100%; }
    #importBtn { margin-top: 6px; }

    /* блоки способностей: textarea markdown слева, живой рендер справа */
    .md-block { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .md-block textarea { min-height: 110px; font-size: 12px; }
    .md-render { font-size: 12.5px; line-height: 1.55; background: var(--surface); border-radius: 8px; padding: 8px 10px; overflow-wrap: break-word; }
    .md-render:empty::before { content: "—"; opacity: 0.4; }
    .md-render p { margin: 0.4em 0; }
    .md-render strong { color: #fff; }

    /* ---- read-режим: аккуратный статблок вместо формы (см. bestiary.js: renderReadView) ---- */
    .sb-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 4px; }
    .sb-portrait { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; background: var(--surface); flex: 0 0 auto; box-shadow: 0 0 0 2px var(--border); }
    .sb-portrait-placeholder { }
    .sb-header-text { flex: 1 1 auto; min-width: 0; }
    .sb-name { margin: 0 0 2px; font-size: 21px; font-weight: 700; color: #fff; }
    .sb-subtitle { font-style: italic; color: var(--text-dim); font-size: 12.5px; }
    .sb-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .sb-tag-pill { background: var(--surface); border-radius: 10px; padding: 1px 8px; font-size: 10.5px; color: var(--text-dim); }

    .sb-hr { height: 2px; background: linear-gradient(to right, var(--accent), transparent 85%); margin: 14px 0; border-radius: 2px; opacity: 0.7; }

    .sb-info { display: flex; flex-direction: column; gap: 3px; }
    .sb-line { font-size: 13px; line-height: 1.55; }
    .sb-line strong { color: #fff; font-weight: 600; }

    .sb-ability-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
    .sb-ability-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 4px; background: var(--surface); text-align: center; }
    .sb-ability-name { display: block; font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 2px; }
    .sb-ability-score { display: block; font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }

    .inline-roll { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; font-weight: 600; }
    .inline-roll:hover { color: #fff; background: var(--accent); border-radius: 3px; border-bottom-color: transparent; }
    .catalog-ref { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue); cursor: pointer; font-weight: 600; }
    .catalog-ref:hover { color: #fff; background: var(--blue); border-radius: 3px; border-bottom-color: transparent; }

    .sb-block { margin: 14px 0; }
    .sb-section-title { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .sb-prose { font-size: 13px; line-height: 1.6; }
    .sb-prose p { margin: 0.5em 0; }
    .sb-prose p:first-child { margin-top: 0; }
    .sb-prose p:last-child { margin-bottom: 0; }
    .sb-prose strong { color: #fff; }
  </style>

<body>

    <span id="monsterTitle">—</span>
    <span id="saveStatus"></span>
    <button id="cloneBtn" type="button" title="Скопировать в свою библиотеку для редактирования"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 15V5a2 2 0 012-2h10"/></svg> Клонировать</button>

  </div>
  <div id="loadingHint">Загрузка…</div>
  <div id="app"></div>
  <div id="rollLogWrap"></div>

</body>
