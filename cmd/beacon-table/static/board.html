<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Шрифты только свои: Excalidraw дописывает к каждому запасной адрес на
       esm.sh, пропсом это не отключается (см. board/editor.js). -->
  <meta http-equiv="Content-Security-Policy" content="font-src 'self' data:" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Доска</title>
  <style>
    /* Редактор на весь экран плюс тонкая шапка. Страница живёт плавающим
       окном поверх стола (см. floating-window.js) у обеих ролей. */
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    #topbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel-bg);
    }
    #boardName { font-size: 14px; font-weight: 600; }
    #boardMeta { color: var(--text-dim); font-size: 12px; }
    #topbarRight { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    /* Доска только для чтения — предупреждаем словами, а не молчаливо
       игнорируем жесты: «почему у меня не рисуется» худший из вопросов. */
    #readonlyBadge {
      display: none; padding: 3px 9px; border-radius: var(--radius-pill);
      background: var(--surface); color: var(--text-dim); font-size: 11px;
    }
    #readonlyBadge.on { display: inline-block; }
    /* Пустое, пока связь есть. */
    #linkState { color: var(--text-dim); font-size: 11px; }
    #linkState.err { color: var(--danger, #e5484d); }
    #peers { color: var(--text-dim); font-size: 11px; }
    .topbar-btn {
      cursor: pointer; padding: 4px 10px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font: inherit; font-size: 11px;
    }
    .topbar-btn:hover { background: var(--surface-hover); }
    #fullscreenBtn { width: 26px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; }

    /* Выбор из списка: монстр, персонаж, трек. */
    .pick-list {
      display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto;
      margin-top: 8px;
    }
    .pick-row {
      cursor: pointer; display: flex; align-items: baseline; gap: 8px; text-align: left;
      padding: 6px 8px; border: 1px solid transparent; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font: inherit; font-size: 12px;
    }
    .pick-row[hidden] { display: none; }
    .pick-row:hover { background: var(--surface-hover); }
    .pick-row.on { border-color: var(--accent, #7c6cf0); }
    .pick-main { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick-meta { flex: 0 0 auto; color: var(--text-dim); font-size: 11px; }

    /* Выбор картинки из уже загруженных. */
    .image-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px; max-height: 320px; overflow: auto; padding: 2px;
    }
    .image-cell {
      cursor: pointer; padding: 0; border: 2px solid transparent; border-radius: var(--radius);
      background: var(--surface); aspect-ratio: 4 / 3; overflow: hidden;
    }
    .image-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-cell.on { border-color: var(--accent, #7c6cf0); }

    #editorWrap { flex: 1 1 auto; min-height: 0; position: relative; }
    /* Excalidraw тянется по контейнеру, но своей высоты не имеет. */
    #editorRoot { position: absolute; inset: 0; }

    /* Excalidraw обрезает содержимое врезки по её границе, а заголовок висит
       НАД рамкой. Разрешаем вылезать — и только нашим врезкам, чужие пусть
       обрезаются как обрезались. */
    /* !important — стили Excalidraw приезжают своим <style> уже после наших. */
    .excalidraw__embeddable-container__inner:has(.board-note) { overflow: visible !important; }

    /* Врезка с записью журнала: рисуется внутри элемента-embeddable, см.
       renderNote в src/pages/board.js. Заголовок вынесен над рамкой, как имя
       у фрейма Excalidraw. */
    .board-note {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; overflow: visible;
      background: var(--panel-bg); color: var(--text);
      font-size: 12px; line-height: 1.5;
    }
    /* Заголовок над левым верхним углом — как имя фрейма у Excalidraw.
       Прокручивается только тело, иначе заголовок уезжал бы вместе с ним. */
    .board-note-title {
      position: absolute; top: -19px; left: 0; right: 0;
      color: var(--text-dim); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .board-note-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 12px; }
    .board-note-empty { padding: 10px 12px; color: var(--text-dim); }
    .board-note-body :where(h1, h2, h3, h4) { margin: 0.6em 0 0.3em; font-size: 1.15em; }
    .board-note-body :where(p, ul, ol, table) { margin: 0.4em 0; }
    .board-note-body img { max-width: 100%; }
    .board-note-body table { border-collapse: collapse; }
    .board-note-body :where(td, th) { border: 1px solid var(--border); padding: 2px 6px; }

    /* Карточка стола во врезке (монстр, персонаж, трек) — см. renderEmbed в
       src/pages/board.js. */
    .board-card {
      width: 100%; height: 100%; box-sizing: border-box; overflow: auto;
      display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
      background: var(--panel-bg); color: var(--text); font-size: 12px; line-height: 1.35;
    }
    .board-card-msg { color: var(--text-dim); }
    .board-card-head { display: flex; align-items: center; gap: 10px; min-height: 0; }
    .board-card-portrait {
      flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      background: var(--surface);
    }
    .board-card-portrait-empty { border: 1px dashed var(--border); box-sizing: border-box; }
    .board-card-titles { flex: 1 1 auto; min-width: 0; }
    .board-card-name {
      display: block; max-width: 100%; padding: 0; border: none; background: none;
      color: var(--text); font: inherit; font-size: 14px; font-weight: 600; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    button.board-card-name { cursor: pointer; }
    button.board-card-name:hover { text-decoration: underline; }
    .board-card-sub {
      color: var(--text-dim); font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .board-card-stats { display: flex; gap: 12px; }
    .board-card-stat { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
    .board-card-stat > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .board-card-stat-label, .board-card-ability-label {
      color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .board-card-abilities {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center;
    }
    .board-card-ability { display: flex; flex-direction: column; white-space: nowrap; }
    .board-card-foot { display: flex; gap: 12px; color: var(--text-dim); font-size: 11px; }
    .board-card-icon { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .board-card-audio .board-card-head > .board-card-icon { width: 28px; height: 28px; justify-content: center; }
    .board-card-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .board-card-btn {
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font: inherit; font-size: 11px;
    }
    .board-card-btn:hover { background: var(--surface-hover); }
    /* Excalidraw глушит клики по врезке, пока её не активируют двойным
       кликом; кнопкам и плееру это ни к чему. */
    .board-card-btn, button.board-card-name, .board-card-audio audio { pointer-events: auto; }
    .board-card-audio audio { flex: 1 1 140px; min-width: 0; height: 28px; }
    /* Сцена: фон широкой миниатюрой, телепорт — чипы соседей. */
    .board-card-map {
      flex: 0 0 auto; width: 64px; height: 44px; border-radius: 6px; object-fit: cover;
      background: var(--surface); display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
    }
    .board-card-teleport { display: flex; flex-direction: column; gap: 4px; }
    span.board-card-chip {
      display: inline-flex; padding: 4px 9px; border-radius: var(--radius);
      background: var(--surface); font-size: 11px;
    }

    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: var(--text-dim); font-size: 13px; text-align: center; line-height: 1.5;
      max-width: 420px; pointer-events: none;
    }

    /* ---- телефон (брейкпоинт общий, см. src/styles/theme.css) ----
       Excalidraw мобильный жест понимает сам; наша тут только шапка — в одну
       строку на 390px она не встаёт. */

    @media (max-width: 860px), (max-height: 500px) {
      #topbar { flex-wrap: wrap; gap: 6px; padding: 7px 10px; }
      #boardName { flex: 1 1 100%; }
      #boardMeta { display: none; }
      #topbarRight { margin-left: 0; flex: 1 1 100%; }
      .topbar-btn { padding: 7px 12px; font-size: 12px; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); max-height: 46dvh; }
    }
  </style>
  <script type="module" crossorigin src="/assets/board-DgyyJshY.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/icons-WhtgNvzO.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-DdPMya_n.js">
  <link rel="modulepreload" crossorigin href="/assets/links-BRiZG_yV.js">
  <link rel="modulepreload" crossorigin href="/assets/modal-Cd_2Sf6-.js">
  <link rel="modulepreload" crossorigin href="/assets/markdown-FUgFLEuY.js">
  <link rel="modulepreload" crossorigin href="/assets/floating-window-CYOXmh6a.js">
  <link rel="modulepreload" crossorigin href="/assets/roles-3liVsLzH.js">
  <link rel="modulepreload" crossorigin href="/assets/fullscreen-yzm6DpJg.js">
  <link rel="stylesheet" crossorigin href="/assets/icons-C_dXvs8g.css">
  <link rel="stylesheet" crossorigin href="/assets/board-BcAUh2Nm.css">
</head>
<body>
  <div id="topbar">
    <span id="boardName">Доска</span>
    <span id="boardMeta"></span>
    <div id="topbarRight">
      <button type="button" class="topbar-btn" id="imageBtn" hidden>Картинка</button>
      <button type="button" class="topbar-btn" id="monsterBtn" hidden>Монстр</button>
      <button type="button" class="topbar-btn" id="charBtn" hidden>Персонаж</button>
      <button type="button" class="topbar-btn" id="musicBtn" hidden>Музыка</button>
      <button type="button" class="topbar-btn" id="sceneBtn" hidden>Сцена</button>
      <button type="button" class="topbar-btn" id="linkScenesBtn" hidden title="Стрелка между двумя выделенными сценами">Связать сцены</button>
      <button type="button" class="topbar-btn" id="linkBtn" hidden>Связать с журналом</button>
      <span id="peers"></span>
      <span id="linkState"></span>
      <span id="readonlyBadge">только чтение</span>
      <button type="button" class="topbar-btn" id="fullscreenBtn"></button>
    </div>
  </div>
  <div id="editorWrap">
    <div id="editorRoot"></div>
    <div id="status">Загружаю доску…</div>
  </div>
</body>
</html>
