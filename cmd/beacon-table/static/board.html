<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Шрифты только свои: Excalidraw дописывает к каждому запасной адрес на
       esm.sh, пропсом это не отключается (см. board/editor.js). -->
  <meta http-equiv="Content-Security-Policy" content="font-src 'self' data:" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Beacon Table — Доска</title>
  <style>
    /* Редактор на весь экран плюс тонкая шапка. Страница живёт плавающим
       окном поверх стола (см. floating-window.js) у обеих ролей. */
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    #topbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel-bg);
    }
    #boardName { font-size: 14px; font-weight: 600; }
    #boardMeta { color: var(--text-dim); font-size: 12px; }
    #topbarRight { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    /* Доска только для чтения — предупреждаем словами, а не молчаливо
       игнорируем жесты: «почему у меня не рисуется» худший из вопросов. */
    #readonlyBadge {
      display: none; padding: 3px 9px; border-radius: var(--radius-pill);
      background: var(--surface); color: var(--text-dim); font-size: 11px;
    }
    #readonlyBadge.on { display: inline-block; }
    /* Пустое, пока связь есть. */
    #linkState { color: var(--text-dim); font-size: 11px; }
    #linkState.err { color: var(--danger, #e5484d); }
    #peers { color: var(--text-dim); font-size: 11px; }
    #linkBtn {
      cursor: pointer; padding: 4px 10px; border: none; border-radius: var(--radius);
      background: var(--surface); color: var(--text); font: inherit; font-size: 11px;
    }
    #linkBtn:hover { background: var(--surface-hover); }

    #editorWrap { flex: 1 1 auto; min-height: 0; position: relative; }
    /* Excalidraw тянется по контейнеру, но своей высоты не имеет. */
    #editorRoot { position: absolute; inset: 0; }

    /* Excalidraw обрезает содержимое врезки по её границе, а заголовок висит
       НАД рамкой. Разрешаем вылезать — и только нашим врезкам, чужие пусть
       обрезаются как обрезались. */
    /* !important — стили Excalidraw приезжают своим <style> уже после наших. */
    .excalidraw__embeddable-container__inner:has(.board-note) { overflow: visible !important; }

    /* Врезка с записью журнала: рисуется внутри элемента-embeddable, см.
       renderNote в src/pages/board.js. Заголовок вынесен над рамкой, как имя
       у фрейма Excalidraw. */
    .board-note {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; overflow: visible;
      background: var(--panel-bg); color: var(--text);
      font-size: 12px; line-height: 1.5;
    }
    /* Заголовок над левым верхним углом — как имя фрейма у Excalidraw.
       Прокручивается только тело, иначе заголовок уезжал бы вместе с ним. */
    .board-note-title {
      position: absolute; top: -19px; left: 0; right: 0;
      color: var(--text-dim); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .board-note-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 12px; }
    .board-note-empty { padding: 10px 12px; color: var(--text-dim); }
    .board-note-body :where(h1, h2, h3, h4) { margin: 0.6em 0 0.3em; font-size: 1.15em; }
    .board-note-body :where(p, ul, ol, table) { margin: 0.4em 0; }
    .board-note-body img { max-width: 100%; }
    .board-note-body table { border-collapse: collapse; }
    .board-note-body :where(td, th) { border: 1px solid var(--border); padding: 2px 6px; }

    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: var(--text-dim); font-size: 13px; text-align: center; line-height: 1.5;
      max-width: 420px; pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="/assets/board-DGJER0Tp.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-DhjkwNA8.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-DdPMya_n.js">
  <link rel="modulepreload" crossorigin href="/assets/modal-DOpLO7Pn.js">
  <link rel="modulepreload" crossorigin href="/assets/markdown-CH_1mRWr.js">
  <link rel="modulepreload" crossorigin href="/assets/floating-window-DKVLSjpf.js">
  <link rel="stylesheet" crossorigin href="/assets/api-jD3yyO8U.css">
  <link rel="stylesheet" crossorigin href="/assets/board-BcAUh2Nm.css">
</head>
<body>
  <div id="topbar">
    <span id="boardName">Доска</span>
    <span id="boardMeta"></span>
    <div id="topbarRight">
      <button type="button" id="linkBtn" hidden>Связать с журналом</button>
      <span id="peers"></span>
      <span id="linkState"></span>
      <span id="readonlyBadge">только чтение</span>
    </div>
  </div>
  <div id="editorWrap">
    <div id="editorRoot"></div>
    <div id="status">Загружаю доску…</div>
  </div>
</body>
</html>
