<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Справочник</title>
  <style>
    /* Та же палитра/база, что itembook.html/spellbook.html/bestiary.html — единая "бумага" для карточек. */
    :root { --radius: 8px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12.5px; display: flex; flex-direction: column;
    }
    button { cursor: pointer; border: none; border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
    button:hover { background: var(--surface-hover); }
    input, textarea, select {
      background: var(--panel-bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; padding: 4px 6px; font: inherit; width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    label.field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-dim); }
    label.field > span { padding-left: 1px; }
    textarea { resize: vertical; min-height: 60px; font-family: inherit; line-height: 1.4; }

    #topBar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      border-bottom: 1px solid var(--border); background: var(--panel-bg); flex-wrap: wrap;
    }
    #refTitle { font-weight: 700; font-size: 15px; margin-right: auto; }
    #saveStatus { font-size: 11px; color: var(--text-dim); min-width: 90px; text-align: right; }
    #saveStatus.saving { color: var(--amber); }
    #saveStatus.error { color: #e74c3c; }
    #closeBtn, #editToggleBtn, #deleteBtn { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; }
    #editToggleBtn.active { background: var(--accent); color: #fff; }
    #deleteBtn:hover { background: var(--danger); color: #fff; }
    /* .sys-pill/#cloneBtn — карточка каталога "из коробки" (domain.Reference.
       System, см. internal/repository/referencefile/system.go): вместо ✎ —
       бейдж "только чтение" и кнопка "Клонировать" (см. itembook.js: boot). */
    .sys-pill { font-size: 10.5px; color: var(--amber); background: rgba(165,115,15,0.16); border-radius: var(--radius-pill); padding: 3px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    #cloneBtn { display: none; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; white-space: nowrap; }
    #cloneBtn.visible { display: inline-flex; }

    #loadingHint { padding: 24px; opacity: 0.6; }
    #app { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: none; padding: 16px; }
    #app.ready { display: block; }

    .section {
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; margin-bottom: 10px;
    }
    .section > h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 120px; }
    .col { display: flex; flex-direction: column; }

    /* портрет/иконка — та же вёрстка, что itembook.html (.portrait-*) */
    .portrait-wrap { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .portrait-img { width: 96px; height: 96px; object-fit: cover; border-radius: var(--radius); background: var(--surface); display: block; flex: 0 0 auto; }
    .portrait-placeholder { width: 96px; height: 96px; border-radius: var(--radius); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; text-align: center; flex: 0 0 auto; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 12px; padding: 2px 8px 2px 10px; font-size: 11px; }
    .tag-pill button { background: none; padding: 0 2px; color: var(--text-dim); }
    .tag-pill button:hover { color: #fff; background: var(--danger); border-radius: 50%; }

    /* описание: textarea markdown/HTML слева, живой рендер справа */
    .md-block { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .md-block textarea { min-height: 220px; font-size: 12px; }
    .md-render { font-size: 12.5px; line-height: 1.55; background: var(--surface); border-radius: 8px; padding: 8px 10px; overflow-wrap: break-word; overflow-x: auto; }
    .md-render:empty::before { content: "—"; opacity: 0.4; }
    .md-render p { margin: 0.4em 0; }
    .md-render strong { color: #fff; }
    .md-render table { border-collapse: collapse; font-size: 11.5px; }
    .md-render th, .md-render td { border: 1px solid var(--border); padding: 3px 7px; }

    /* импорт — батчевый, см. reference-import.js: mapFoundryReferenceBatch */
    #importSection .hint { font-size: 11px; opacity: 0.65; margin: 0 0 8px; line-height: 1.5; }
    #importMsg { font-size: 11px; margin-top: 6px; min-height: 14px; }
    #importMsg.error { color: #e74c3c; }
    #importMsg.ok { color: #6fbf73; }

    /* ---- read-режим: аккуратная карточка вместо формы ---- */
    .ib-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 4px; }
    .ib-portrait { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; background: var(--surface); flex: 0 0 auto; box-shadow: 0 0 0 2px var(--border); }
    .ib-header-text { margin-bottom: 4px; flex: 1 1 auto; min-width: 0; }
    .ib-name { margin: 0 0 2px; font-size: 21px; font-weight: 700; color: #fff; }
    .ib-subtitle { font-style: italic; color: var(--text-dim); font-size: 12.5px; }
    .ib-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .ib-tag-pill { background: var(--surface); border-radius: 10px; padding: 1px 8px; font-size: 10.5px; color: var(--text-dim); }

    .ib-hr { height: 2px; background: linear-gradient(to right, var(--accent), transparent 85%); margin: 14px 0; border-radius: 2px; opacity: 0.7; }

    .ib-info { display: flex; flex-direction: column; gap: 3px; }
    .ib-line { font-size: 13px; line-height: 1.55; }
    .ib-line strong { color: #fff; font-weight: 600; }

    .ib-block { margin: 14px 0; }
    .ib-section-title { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .ib-prose { font-size: 13px; line-height: 1.6; overflow-x: auto; }
    .ib-prose p { margin: 0.5em 0; }
    .ib-prose p:first-child { margin-top: 0; }
    .ib-prose p:last-child { margin-bottom: 0; }
    .ib-prose strong { color: #fff; }
    .ib-prose table { border-collapse: collapse; font-size: 12px; }
    .ib-prose th, .ib-prose td { border: 1px solid var(--border); padding: 4px 8px; }

    .catalog-ref { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue); cursor: pointer; font-weight: 600; }
    .catalog-ref:hover { color: #fff; background: var(--blue); border-radius: 3px; border-bottom-color: transparent; }
  </style>
  <script type="module" crossorigin src="/assets/referencebook-By4B6QeC.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-CY8linmZ.js">
  <link rel="modulepreload" crossorigin href="/assets/icons-3nongrBp.js">
  <link rel="modulepreload" crossorigin href="/assets/markdown-D4FZCO_d.js">
  <link rel="modulepreload" crossorigin href="/assets/reference-import-BVSlkDwC.js">
  <link rel="modulepreload" crossorigin href="/assets/catalog-links-DHoeTXEI.js">
  <link rel="stylesheet" crossorigin href="/assets/api-rS-ciWvP.css">
</head>
<body>
  <div id="topBar">
    <span id="refTitle">—</span>
    <span id="saveStatus"></span>
    <button id="cloneBtn" type="button" title="Скопировать в библиотеку для редактирования"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 15V5a2 2 0 012-2h10"/></svg> Клонировать</button>
    <button id="editToggleBtn" type="button" title="Редактировать"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16 4.5 19.5 8 8.5 19 4 20z"/><line x1="14.2" y1="6.3" x2="17.7" y2="9.8"/></svg></button>
    <button id="deleteBtn" type="button" title="Удалить из библиотеки"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
    <button id="closeBtn" type="button" title="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
  </div>
  <div id="loadingHint">Загрузка…</div>
  <div id="app"></div>

</body>
</html>
