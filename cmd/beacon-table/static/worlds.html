<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Миры</title>
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }

    #page {
      width: 480px; max-width: 100%;
      background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
      padding: 26px 26px 22px;
    }

    header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; }
    #subtitle { opacity: 0.6; font-size: 12px; margin: 4px 0 20px; }
    #logoutBtn {
      background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
      padding: 6px 10px; border-radius: var(--radius); transition: background .12s ease, color .12s ease;
    }
    #logoutBtn:hover { background: var(--surface); color: var(--text); }

    #list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    #emptyMsg { font-size: 13px; opacity: 0.6; padding: 10px 2px; }

    .world-card { padding: 12px 14px; justify-content: space-between; }
    .world-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .world-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .world-meta { display: flex; gap: 6px; }
    .world-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .world-btn {
      border: none; border-radius: var(--radius-pill); padding: 7px 14px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .12s ease;
    }
    .launch-btn { background: var(--accent-bg); color: var(--accent); }
    .launch-btn:hover { background: var(--accent); color: #fff; }
    .launch-btn:disabled { opacity: 0.6; cursor: default; }
    .open-btn { background: var(--green); color: #fff; }
    .open-btn:hover { background: var(--green-hover); }

    #createBox { border-top: 1px solid var(--border); padding-top: 18px; }
    #createBox h2 { font-size: 13px; margin: 0 0 12px; opacity: 0.75; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    #createForm { display: flex; gap: 8px; }
    #createForm input, #createForm select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 10px; font-size: 13px; font: inherit;
    }
    #createForm input { flex: 1 1 auto; min-width: 0; }
    #createForm select { flex: 0 0 auto; }
    #createForm input:focus, #createForm select:focus { outline: none; border-color: var(--accent); }
    #createForm button {
      flex: 0 0 auto; border: none; border-radius: var(--radius); background: var(--green); color: #fff;
      font-size: 13px; font-weight: 600; padding: 9px 14px; cursor: pointer; transition: background .12s ease;
    }
    #createForm button:hover { background: var(--green-hover); }

    .msg { font-size: 12px; margin-top: 10px; min-height: 14px; }
    .msg.error { color: #e74c3c; }
    .msg.ok { color: var(--green-bright); }
  </style>
  <script type="module" crossorigin src="/assets/worlds-DBZS85RN.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-G57AFaqs.js">
  <link rel="stylesheet" crossorigin href="/assets/api-rS-ciWvP.css">
</head>
<body>
  <div id="page">
    <header>
      <div>
        <h1>Миры</h1>
        <div id="subtitle">выбери мир, чтобы продолжить — на столе может быть запущен только один</div>
      </div>
      <button id="logoutBtn">Выйти</button>
    </header>

    <div id="list"><div id="emptyMsg">Загрузка…</div></div>

    <section id="createBox">
      <h2>Создать мир</h2>
      <form id="createForm">
        <input type="text" id="worldName" placeholder="Название мира" maxlength="80" required />
        <select id="worldSystem">
          <option value="dnd5e-2024">D&amp;D 2024</option>
          <option value="dnd5e-2014">D&amp;D 5e (2014)</option>
        </select>
        <button type="submit">Создать</button>
      </form>
      <div id="createMsg" class="msg"></div>
    </section>
  </div>

</body>
</html>
