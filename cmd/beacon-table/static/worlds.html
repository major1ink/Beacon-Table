<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Миры</title>
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }

    /* Та же заставка на весь экран, что и на экране входа (index.html) —
       position: fixed + inset: 0, карточка выбора мира лежит выше по z-index.
       Заменить картинку = положить свой файл вместо web/public/splash.svg. */
    #splash {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg) url("/splash.svg") 30% center / cover no-repeat;
    }

    /* Версия сервера (GET /api/version) — в углу поверх заставки, как на входе.
       Пустой, пока ответ не пришёл. */
    #appVersion {
      position: fixed; z-index: 1; right: 12px; bottom: 10px;
      font-size: 11px; letter-spacing: 0.02em; color: var(--text-dim);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    #page {
      position: relative; z-index: 1;
      width: 480px; max-width: 100%;
      background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
      padding: 26px 26px 22px;
    }

    header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; }
    #subtitle { opacity: 0.6; font-size: 12px; margin: 4px 0 20px; }
    #logoutBtn {
      background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
      padding: 6px 10px; border-radius: var(--radius); transition: background .12s ease, color .12s ease;
    }
    #logoutBtn:hover { background: var(--surface); color: var(--text); }

    #list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    #emptyMsg { font-size: 13px; opacity: 0.6; padding: 10px 2px; }

    .world-card { padding: 12px 14px; justify-content: space-between; }
    .world-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .world-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .world-meta { display: flex; gap: 6px; }
    .world-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .world-btn {
      border: none; border-radius: var(--radius-pill); padding: 7px 14px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .12s ease;
    }
    .launch-btn { background: var(--accent-bg); color: var(--accent); }
    .launch-btn:hover { background: var(--accent); color: #fff; }
    .launch-btn:disabled { opacity: 0.6; cursor: default; }
    .open-btn { background: var(--green); color: #fff; }
    .open-btn:hover { background: var(--green-hover); }

    #createBox { border-top: 1px solid var(--border); padding-top: 18px; }
    #createBox h2 { font-size: 13px; margin: 0 0 12px; opacity: 0.75; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    #createForm { display: flex; gap: 8px; }
    #createForm input, #createForm select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 10px; font-size: 13px; font: inherit;
    }
    #createForm input { flex: 1 1 auto; min-width: 0; }
    #createForm select { flex: 0 0 auto; }
    #createForm input:focus, #createForm select:focus { outline: none; border-color: var(--accent); }
    #createForm button {
      flex: 0 0 auto; border: none; border-radius: var(--radius); background: var(--green); color: #fff;
      font-size: 13px; font-weight: 600; padding: 9px 14px; cursor: pointer; transition: background .12s ease;
    }
    #createForm button:hover { background: var(--green-hover); }

    #importRow { margin-top: 12px; }
    #importBtn {
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text-dim);
      font-size: 12.5px; font-weight: 600; padding: 8px 12px; cursor: pointer; transition: background .12s ease, color .12s ease;
    }
    #importBtn:hover { background: var(--surface-hover, var(--surface)); color: var(--text); }
    #importBtn:disabled { opacity: 0.6; cursor: default; }

    .msg { font-size: 12px; margin-top: 10px; min-height: 14px; }
    .msg.error { color: #e74c3c; }
    .msg.ok { color: var(--green-bright); }

    #headerActions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
    #shutdownBtn {
      background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
      padding: 6px 10px; border-radius: var(--radius); transition: background .12s ease, color .12s ease;
    }
    #shutdownBtn:hover { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }

    /* Блок смены временного пароля — заметный, но не пугающий: это первое,
       что стоит сделать, а не ошибка. */
    #passwordBox {
      border: 1px solid var(--accent); border-radius: var(--radius); padding: 14px; margin-bottom: 18px;
      background: var(--accent-bg);
    }
    #passwordBox h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
    .pwd-hint { font-size: 12px; opacity: 0.75; margin: 0 0 10px; line-height: 1.45; }
    #passwordForm { display: flex; gap: 8px; flex-wrap: wrap; }
    #passwordForm input {
      flex: 1 1 140px; min-width: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 10px; font-size: 13px; font: inherit;
    }
    #passwordForm input:focus { outline: none; border-color: var(--accent); }
    #passwordForm button {
      flex: 0 0 auto; border: none; border-radius: var(--radius); background: var(--green); color: #fff;
      font-size: 13px; font-weight: 600; padding: 9px 14px; cursor: pointer;
    }
    #passwordForm button:disabled { opacity: 0.6; cursor: default; }
  </style>
  <script type="module" crossorigin src="/assets/worlds-B2aE8_Et.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-DaoMOxZO.js">
  <link rel="modulepreload" crossorigin href="/assets/modal-g49pjxWl.js">
  <link rel="stylesheet" crossorigin href="/assets/api-ChjuER52.css">
</head>
<body>
  <div id="splash"></div>

  <div id="page">
    <header>
      <div>
        <h1>Миры</h1>
        <div id="subtitle">выбери мир, чтобы продолжить — на столе может быть запущен только один</div>
      </div>
      <div id="headerActions">
        <button id="logoutBtn">Выйти</button>
        <button id="shutdownBtn" title="Остановить программу: мир сохранится, стол закроется у всех">Выключить сервер</button>
      </div>
    </header>

    <!-- Смена временного пароля ДМ. Показывается, пока пароль временный
         (GET /api/me: mustChangePassword) — он перевыпускается при КАЖДОМ
         запуске программы, и пока свой не задан, входить каждый раз
         приходится по новому. См. web/src/pages/worlds.js. -->
    <section id="passwordBox" style="display:none">
      <h2>Задайте свой пароль</h2>
      <p class="pwd-hint">Сейчас вы вошли по временному паролю — он выдаётся заново при каждом запуске программы. Свой пароль задаётся один раз и работает всегда.</p>
      <form id="passwordForm">
        <input type="password" id="curPassword" placeholder="Временный пароль" autocomplete="current-password" required />
        <input type="password" id="newPassword" placeholder="Новый пароль" autocomplete="new-password" required />
        <button type="submit">Сохранить</button>
      </form>
      <div id="passwordMsg" class="msg"></div>
    </section>

    <div id="list"><div id="emptyMsg">Загрузка…</div></div>

    <section id="createBox">
      <h2>Создать мир</h2>
      <form id="createForm">
        <input type="text" id="worldName" placeholder="Название мира" maxlength="80" required />
        <select id="worldSystem">
          <option value="dnd5e-2024">D&amp;D 2024</option>
          <option value="dnd5e-2014">D&amp;D 5e (2014)</option>
        </select>
        <button type="submit">Создать</button>
      </form>
      <div id="createMsg" class="msg"></div>

      <div id="importRow">
        <button type="button" id="importBtn">Импортировать мир из .zip</button>
        <input type="file" id="importFile" accept=".zip,application/zip" hidden />
      </div>
      <div id="importMsg" class="msg"></div>
    </section>
  </div>

  <div id="appVersion"></div>

</body>
</html>
