  <style>
    /* Каркас карточки — card.css; здесь только шапка окна и то, что есть
       лишь у предметов (лог бросков, импорт). */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; display: flex; flex-direction: column;
    }
    button { cursor: pointer; border: none; border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
    button:hover { background: var(--surface-hover); }

    #topBar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      border-bottom: 1px solid var(--border); background: var(--panel-bg); flex-wrap: wrap;
    }
    #itemTitle { font-weight: 700; font-size: 15px; margin-right: auto; }
    #saveStatus { font-size: 11px; color: var(--text-dim); min-width: 90px; text-align: right; }
    #saveStatus.saving { color: var(--amber); }
    #saveStatus.error { color: #e74c3c; }
    #closeBtn, #fullscreenBtn, #editToggleBtn, #deleteBtn { width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; }
    #editToggleBtn.active { background: var(--accent); color: #fff; }
    #deleteBtn:hover { background: var(--danger); color: #fff; }
    .sys-pill { font-size: 10.5px; color: var(--amber); background: rgba(165,115,15,0.16); border-radius: var(--radius-pill); padding: 3px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    #cloneBtn { display: none; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; white-space: nowrap; }
    #cloneBtn.visible { display: inline-flex; }

    #loadingHint { padding: 24px; opacity: 0.6; }
    #app { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: none; }
    #app.ready { display: block; }

    /* описание: textarea markdown/HTML + живой рендер */
    .md-block { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .md-block textarea { min-height: 160px; font-size: 12px; }
    .md-render { font-size: 12.5px; line-height: 1.55; background: var(--surface); border-radius: 8px; padding: 8px 10px; overflow-wrap: break-word; }
    .md-render:empty::before { content: "—"; opacity: 0.4; }
    .md-render p { margin: 0.4em 0; }
    .md-render strong { color: #fff; }

    #importMsg { font-size: 11px; margin-top: 6px; min-height: 14px; }
    #importMsg.error { color: #e74c3c; }
    #importMsg.ok { color: #6fbf73; }
    #importTextarea { min-height: 70px; font-family: monospace; font-size: 11px; }
    #importBtn { justify-self: start; }

    .inline-roll { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; font-weight: 600; }
    .inline-roll:hover { color: #fff; background: var(--accent); border-radius: 3px; border-bottom-color: transparent; }
    .catalog-ref { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue); cursor: pointer; font-weight: 600; }
    .catalog-ref:hover { color: #fff; background: var(--blue); border-radius: 3px; border-bottom-color: transparent; }

    @container card (max-width: 560px) {
      .md-block { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px), (max-height: 500px) {
      #app { padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
