<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Beacon Table — Заметка</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; display: flex; flex-direction: column;
    }
    button { cursor: pointer; padding: 7px 12px; border: none; border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
    button:hover { background: var(--surface-hover); }

    #topBar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: var(--panel-bg);
    }
    #noteTitleBar { flex: 1 1 auto; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn {
      width: 32px; height: 32px; padding: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: var(--surface); border-radius: 8px; font-size: 15px;
    }
    .icon-btn:hover { background: var(--surface-hover); }
    .icon-btn.active { background: var(--accent-bg); color: var(--accent); }
    #deleteBtn:hover { background: var(--danger); }
    #saveBtn { background: var(--green); display: none; width: auto; padding: 0 14px; font-weight: 500; }
    #saveBtn:hover { background: var(--green-hover); }

    #msg { padding: 8px 20px 0; color: #e74c3c; font-size: 12px; min-height: 14px; }
    #loadingHint { padding: 20px; opacity: 0.6; }

    #contentArea { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: none; }
    #body { max-width: 780px; margin: 0 auto; padding: 24px 28px 60px; }
    #editWrap { display: none; flex-direction: column; height: 100%; box-sizing: border-box; padding: 12px 16px 16px; gap: 8px; }
    #editArea {
      flex: 1 1 auto; width: 100%; box-sizing: border-box; resize: none;
      background: var(--panel-bg); border: 1px solid var(--border); color: #eee; border-radius: 8px;
      padding: 14px 16px; font: 13px/1.6 "Cascadia Code", Consolas, monospace;
    }
    #editArea:focus { outline: none; border-color: var(--accent); }

    /* панель форматирования (см. web/src/notes/toolbar.js) */
    .note-toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    .note-toolbar-group { display: flex; gap: 2px; background: var(--surface); border-radius: 8px; padding: 3px; }
    .note-toolbar-btn {
      min-width: 30px; height: 30px; padding: 0 8px; background: none; border-radius: 6px;
      font-size: 13px; line-height: 1; color: var(--text-dim);
    }
    .note-toolbar-btn:hover { background: var(--surface-hover); color: var(--text); }
    .note-toolbar-btn.tb-bold { font-weight: 700; }
    .note-toolbar-btn.tb-italic { font-style: italic; }
    .note-toolbar-btn.tb-strike { text-decoration: line-through; }
    .note-toolbar-file-input { display: none; }

    .note-render { font-size: 15px; line-height: 1.7; overflow-wrap: break-word; }
    .note-render h1, .note-render h2, .note-render h3 { margin: 0.8em 0 0.35em; line-height: 1.3; }
    .note-render h1:first-child, .note-render h2:first-child, .note-render h3:first-child { margin-top: 0; }
    .note-render h1 { font-size: 1.7em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    .note-render h2 { font-size: 1.35em; }
    .note-render h3 { font-size: 1.15em; opacity: 0.9; }
    .note-render p { margin: 0.6em 0; }
    .note-render a { color: var(--accent); text-decoration: none; }
    .note-render a:hover { text-decoration: underline; }
    .note-render code { background: var(--surface); border-radius: 4px; padding: 1px 6px; font-size: 0.88em; }
    .note-render pre { background: var(--surface); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
    .note-render pre code { background: none; padding: 0; }
    .note-render blockquote { margin: 0.6em 0; padding: 2px 14px; border-left: 3px solid var(--accent); opacity: 0.85; }
    .note-render ul, .note-render ol { margin: 0.4em 0; padding-left: 1.6em; }
    .note-render img { max-width: 100%; border-radius: 6px; }
    .note-render hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .note-render table { border-collapse: collapse; }
    .note-render th, .note-render td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .note-render th { background: var(--surface); }
  </style>
  <script type="module" crossorigin src="/assets/noteWindow-CUDsSWW7.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-G57AFaqs.js">
  <link rel="modulepreload" crossorigin href="/assets/markdown-D4FZCO_d.js">

  <link rel="modulepreload" crossorigin href="/assets/icons-3nongrBp.js">
  <link rel="stylesheet" crossorigin href="/assets/api-rS-ciWvP.css">
</head>
<body>

    <span id="noteTitleBar">—</span>
    <button id="editToggleBtn" class="icon-btn" title="Редактировать"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16 4.5 19.5 8 8.5 19 4 20z"/><line x1="14.2" y1="6.3" x2="17.7" y2="9.8"/></svg></button>
    <button id="saveBtn" style="display:none;align-items:center;gap:7px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg> Сохранить</button>
    <button id="deleteBtn" class="icon-btn" title="Удалить"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
  </div>
  <div id="msg"></div>
  <div id="loadingHint">Загрузка…</div>
  <div id="contentArea">
    <div id="body" class="note-render"></div>
    <div id="editWrap">
      <div id="editToolbar" class="note-toolbar"></div>
      <textarea id="editArea" placeholder="# Заголовок&#10;&#10;markdown, [[Другая заметка]] — вики-ссылка…"></textarea>
    </div>
  </div>

</body>
</html>
