# Черновик записи в changelog.html сайта после каждого релиза.
# Открывает PR в приватный репозиторий сайта, ничего не публикует сам —
# смёрджить и вычитать текст нужно руками.
#
# Настройка секрета — в DEPLOY.md репозитория сайта, раздел «Обслуживание».

name: site-changelog-draft

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout сайта
        uses: actions/checkout@v4
        with:
          repository: major1ink/beacon-table-site
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Собрать черновик записи
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PYEOF'
          import os, re, datetime

          tag = os.environ["TAG"]
          body = os.environ.get("BODY") or ""
          version = tag.lstrip("v")
          path = "changelog.html"
          html = open(path, encoding="utf-8").read()

          if f">{tag} <" in html or f">{version} <" in html:
              print(f"Запись про {tag} уже есть в changelog.html, пропускаю.")
              raise SystemExit(0)

          months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                     "июля", "августа", "сентября", "октября", "ноября", "декабря"]
          today = datetime.date.today()
          date_iso = today.isoformat()
          date_ru = f"{today.day} {months[today.month - 1]} {today.year}"

          bullets = []
          for line in body.splitlines():
              m = re.match(r"^\*\s+[0-9a-f]{7,40}\s+(.*)$", line.strip())
              if m:
                  bullets.append(m.group(1).strip())
          bullets_html = "\n".join(f"      <li>{b}</li>" for b in bullets) or "      <li>...</li>"

          entry = f'''    <!-- ЧЕРНОВИК (site-changelog-draft): проверить формулировки,
         объединить/сократить пункты под голос сайта, придумать заголовок,
         убрать этот комментарий перед мерджем. -->
    <h2 style="margin-top:0">
       {tag} <span style="color:var(--text-faint);font-weight:400;font-size:.7em"> — <time datetime="{date_iso}">{date_ru}</time></span>
    </h2>
    <p><strong>ЧЕРНОВИК ЗАГОЛОВКА — придумать одну фразу о главном.</strong></p>
    <ul>
{bullets_html}
    </ul>

'''

          html = html.replace('<h2 style="margin-top:0">', '<h2>', 1)
          marker = '<section class="prose" style="padding-top:24px">\n  <div class="wrap narrow">\n\n'
          idx = html.find(marker)
          if idx == -1:
              raise SystemExit("Не нашёл место вставки в changelog.html — вёрстка изменилась, поправь скрипт site-changelog-draft.yml.")
          insert_at = idx + len(marker)
          html = html[:insert_at] + entry + html[insert_at:]

          open(path, "w", encoding="utf-8").write(html)
          print(f"Черновик для {tag} добавлен.")
          PYEOF

      - name: Открыть PR
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"

          if git diff --quiet -- changelog.html; then
            echo "Нечего коммитить (запись уже есть или парсер не нашёл коммитов)."
            exit 0
          fi

          BRANCH="changelog-draft/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add changelog.html
          git commit -m "Черновик changelog для $TAG (авто)"
          git push -u origin "$BRANCH"

          gh pr create --repo major1ink/beacon-table-site \
            --title "Черновик: описание $TAG в changelog" \
            --body "Автоматический черновик по релизу [$TAG](https://github.com/major1ink/Beacon-Table/releases/tag/$TAG). Нужно проверить и переписать текст под голос сайта, убрать HTML-комментарий с пометкой «ЧЕРНОВИК» перед мерджем." \
            --head "$BRANCH" --base main
