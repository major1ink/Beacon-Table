name: release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-site:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Дёрнуть зеркало релизов на сайте
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api repos/major1ink/beacon-table-site/dispatches \
            -f event_type=release-published \
            -f 'client_payload[tag]=${{ github.ref_name }}'

  telegram:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Анонс версии в канале
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$TG_TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN не задан, пропускаю"; exit 0; }
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            | grep -v '^## \|Full Changelog' | sed -E 's/^\* [0-9a-f]+: /• /' | head -c 3000)
          text="Вышла версия ${TAG#v}

          $notes

          Скачать: https://beacontable.ru/download.html
          Релиз на GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          curl -sS -f -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=@beacontable" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
