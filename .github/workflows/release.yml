name: release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog-draft:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout сайта
        uses: actions/checkout@v4
        with:
          repository: major1ink/beacon-table-site
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Собрать черновик записи
        env:
          TAG: ${{ github.ref_name }}
          SRC_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "$TAG" --repo "$SRC_REPO" --json body -q .body)"
          export BODY

          python3 - <<'PYEOF'
          import os, re, datetime

          tag = os.environ["TAG"]
          body = os.environ.get("BODY") or ""
          version = tag.lstrip("v")
          path = "changelog.html"
          html = open(path, encoding="utf-8").read()

          if f">{tag} <" in html or f">{version} <" in html:
              print(f"Запись про {tag} уже есть в changelog.html, пропускаю.")
              raise SystemExit(0)

          months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                     "июля", "августа", "сентября", "октября", "ноября", "декабря"]
          today = datetime.date.today()
          date_iso = today.isoformat()
          date_ru = f"{today.day} {months[today.month - 1]} {today.year}"

          bullets = []
          for line in body.splitlines():
              m = re.match(r"^\*\s+[0-9a-f]{7,40}\s+(.*)$", line.strip())
              if m:
                  bullets.append(m.group(1).strip())
          bullets_html = "\n".join(f"      <li>{b}</li>" for b in bullets) or "      <li>...</li>"

          entry = "\n".join([
              '    <!-- ЧЕРНОВИК (release.yml): проверить формулировки,',
              '         объединить/сократить пункты под голос сайта, придумать заголовок,',
              '         убрать этот комментарий перед мерджем. -->',
              '    <h2 style="margin-top:0">',
              f'       {tag} <span style="color:var(--text-faint);font-weight:400;font-size:.7em"> — <time datetime="{date_iso}">{date_ru}</time></span>',
              '    </h2>',
              '    <p><strong>ЧЕРНОВИК ЗАГОЛОВКА — придумать одну фразу о главном.</strong></p>',
              '    <ul>',
              bullets_html,
              '    </ul>',
              '',
          ]) + "\n"

          html = html.replace('<h2 style="margin-top:0">', '<h2>', 1)
          marker = '<section class="prose" style="padding-top:24px">\n  <div class="wrap narrow">\n\n'
          idx = html.find(marker)
          if idx == -1:
              raise SystemExit("Не нашёл место вставки в changelog.html — вёрстка изменилась, поправь скрипт в release.yml.")
          insert_at = idx + len(marker)
          html = html[:insert_at] + entry + html[insert_at:]

          open(path, "w", encoding="utf-8").write(html)
          print(f"Черновик для {tag} добавлен.")
          PYEOF

      - name: Открыть PR
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
          SRC_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- changelog.html; then
            echo "Нечего коммитить (запись уже есть или парсер не нашёл коммитов)."
            exit 0
          fi

          BRANCH="changelog-draft/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add changelog.html
          git commit -m "Черновик changelog для $TAG (авто)"
          git push -u origin "$BRANCH"

          gh pr create --repo major1ink/beacon-table-site \
            --title "Черновик: описание $TAG в changelog" \
            --body "Автоматический черновик по релизу [$TAG](https://github.com/$SRC_REPO/releases/tag/$TAG). Нужно проверить и переписать текст под голос сайта, убрать HTML-комментарий с пометкой «ЧЕРНОВИК» перед мерджем." \
            --head "$BRANCH" --base main
