name: release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Заметки к версии
        run: |
          f="docs/releases/${{ github.ref_name }}.md"
          [ -s "$f" ] || { echo "::error::Нет файла $f — напишите заметки к версии и пересоздайте тег"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-site:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Дёрнуть зеркало релизов на сайте
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api repos/major1ink/beacon-table-site/dispatches \
            -f event_type=release-published \
            -f 'client_payload[tag]=${{ github.ref_name }}'

  telegram:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Анонс версии в канале
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$TG_TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN не задан, пропускаю"; exit 0; }
          notes=$(sed -E 's/^#+ *//; s/^[-*] /• /; s/\*\*//g' "docs/releases/$TAG.md")
          text="Вышла версия ${TAG#v}

          ${notes:0:3500}

          Скачать: https://beacontable.ru/download.html
          Релиз на GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          resp=$(curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage"             --data-urlencode "chat_id=@beacontable"             --data-urlencode "text=$text"             --data-urlencode "disable_web_page_preview=true")
          echo "$resp" | jq -e .ok > /dev/null || { echo "Telegram: $(echo "$resp" | jq -r .description)"; exit 1; }
