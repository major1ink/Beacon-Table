name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          # Экшен ищет нужный релиз Task через GitHub API. Без токена запрос
          # анонимный, а лимит у него — 60 в час НА IP раннера, общий для всех
          # чужих сборок с той же машины: рано или поздно job падает с "API
          # rate limit exceeded" на ровном месте. С GITHUB_TOKEN лимит
          # считается по репозиторию (тысячи в час), и хватает его с запасом.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test
        run: task test

      - name: task web:build:check
        run: task web:build:check

      - name: task lint
        run: task lint
