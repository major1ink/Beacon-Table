<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Beacon Table — Доска</title>
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <style>
    /* Доска: бесконечный холст на весь экран плюс тонкая шапка сверху.
       Страница живёт плавающим окном поверх стола (см. floating-window.js)
       и у ДМ, и у игрока — как журнал. */
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    button { cursor: pointer; padding: 6px 11px; border: none; border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; font-size: 12px; }
    button:hover { background: var(--surface-hover); }

    #topbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel-bg);
    }
    #boardName { font-size: 14px; font-weight: 600; }
    #boardMeta { color: var(--text-dim); font-size: 12px; }
    #topbarRight { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    /* Доска только для чтения — предупреждаем словами, а не молчаливо
       игнорируем жесты: «почему у меня не рисуется» худший из вопросов. */
    #readonlyBadge {
      display: none; padding: 3px 9px; border-radius: var(--radius-pill);
      background: var(--surface); color: var(--text-dim); font-size: 11px;
    }
    #readonlyBadge.on { display: inline-block; }

    /* Обёртка канваса: Pixi подгоняет размер под неё через ResizeObserver. */
    #canvasWrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
    #board { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #board.panning { cursor: grabbing; }

    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: var(--text-dim); font-size: 13px; text-align: center; line-height: 1.5;
    }
    #zoomHud {
      position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border-radius: var(--radius-pill);
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
    }
    #zoomHud button { padding: 4px 8px; background: none; color: var(--text-dim); }
    #zoomHud button:hover { background: var(--surface); color: var(--text); }
    #zoomLevel { min-width: 44px; text-align: center; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="boardName">Доска</span>
    <span id="boardMeta"></span>
    <div id="topbarRight">
      <span id="readonlyBadge">только чтение</span>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="board"></canvas>
    <div id="status">Загружаю доску…</div>
    <div id="zoomHud">
      <button id="zoomOutBtn" title="Отдалить">−</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn" title="Приблизить">+</button>
      <button id="zoomResetBtn" title="Вернуться в начало координат">Сброс</button>
    </div>
  </div>
  <script type="module" src="/src/pages/board.js"></script>
</body>
</html>
