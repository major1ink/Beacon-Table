<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beacon Table — Игрок</title>
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <style>
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }

    #app { position: fixed; inset: 0; display: none; flex-direction: column; }
    #app.ready { display: flex; }

    #topbar {
      position: absolute; left: 10px; right: 10px; top: 10px; padding: 7px 10px; display: flex; gap: 6px;
      align-items: center; font-size: 13px; z-index: 6;
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-pill); box-shadow: var(--shadow-soft);
    }
    #topbar button {
      cursor: pointer; padding: 7px 11px; border: none; border-radius: var(--radius-pill);
      background: none; color: var(--text-dim); font: inherit; font-size: 12px;
      display: flex; align-items: center; gap: 6px; transition: background .12s ease, color .12s ease;
    }
    #topbar button svg { flex: 0 0 auto; }
    #topbar button:hover { background: var(--surface); color: var(--text); }
    #topbar button.active { background: #e74c3c; color: #fff; }
    #topbarUsername { opacity: 0.65; padding-left: 6px; flex: 0 0 auto; }

    /* ---- #charDock — быстрый доступ к листам своих персонажей: аватар +
       имя, клик открывает тот же плавающий лист, что и кнопка "Лист" в
       модалке "Мои персонажи" (см. pages/player.js: openCharacterSheet).
       Живёт прямо в топбаре, чтобы не отнимать место у карты; при большом
       числе персонажей ряд скроллится горизонтально, а не переносится. ---- */
    #charDock {
      flex: 1 1 auto; min-width: 0; display: flex; gap: 5px; align-items: center;
      overflow-x: auto; scrollbar-width: none; padding: 0 4px;
    }
    #charDock::-webkit-scrollbar { display: none; }

    /* #combatBarMount — трекер инициативы (см. src/vtt/combat-bar.js) теперь
       живёт прямо в топбаре, а не отдельным плавающим оверлеем поверх него:
       раньше combat-bar.js рисовал свою полосу position:fixed по центру
       канваса, и она перекрывала кнопки топбара (Хаб/Линейка/Настройки),
       когда бой шёл, а панель — короткой. Пустой (бой не идёт) места не
       занимает — сам combat-bar.js прячет полосу через display:none. */
    #combatBarMount { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; }
    .char-chip {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px; max-width: 150px;
      cursor: pointer; padding: 3px 10px 3px 3px; border: 1px solid transparent; border-radius: var(--radius-pill);
      background: var(--surface); color: var(--text); font: inherit; font-size: 12px;
      transition: background .12s ease, border-color .12s ease;
    }
    .char-chip:hover { background: var(--surface-hover); border-color: var(--accent); }
    .char-chip-avatar {
      width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
      background: var(--surface-hover) center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim);
    }
    .char-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* #stage — ряд "лист персонажа слева | карта справа". Док (см.
       web/src/sheet-dock.js) карту не перекрывает, а ужимает: канвас меряет
       СВОЮ обёртку (#canvasWrap) через ResizeObserver (см. vtt/index.js),
       так что открытие/закрытие/растягивание дока Pixi отрабатывает сам. */
    #stage { flex: 1 1 auto; min-height: 0; display: flex; }
    #canvasWrap { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
    /* canvas абсолютным позиционированием ВЫНУТ из потока намеренно: Pixi
       выставляет ему инлайновые width/height в пикселях (autoDensity), и
       пока канвас в потоке, высота #canvasWrap зависит от него, а он —
       от #canvasWrap. На этой круговой зависимости панель кубов внизу и
       пропадала: канвас успевал померить обёртку, пока док был ещё пустой,
       и потом накрывал его собой, вылезая за нижнюю границу. */
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; background: #222; }

    /* ---- HUD зума — тот же плавающий кружок-пилюля, что и у ДМ (см.
       web/dm.html: #zoomHud) — тут своя копия правил кнопки, страница не
       подключает общий сброс `button {...}` дм-страницы. ---- */
    #zoomHud {
      position: absolute; right: 10px; bottom: 10px; z-index: 5;
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
      border-radius: var(--radius-pill); padding: 4px; display: flex; gap: 4px;
    }
    #zoomHud button {
      cursor: pointer; width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%;
      background: var(--surface); color: var(--text); font: inherit; transition: background .12s ease;
      display: flex; align-items: center; justify-content: center;
    }
    #zoomHud button svg { flex: 0 0 auto; }
    #zoomHud button:hover { background: var(--surface-hover); }

    /* ---- #diceDock — лоток кубов (см. web/src/dice.js) одной строкой вдоль
       низа экрана: у игрока это основной инструмент, он должен быть виден
       всегда, а не прятаться в меню, — поэтому строка, а не колонка, чтобы
       карте оставалось максимум высоты. Узко (телефон/половина экрана) —
       переносится на несколько строк сам. Лог бросков в док не входит: он
       плавает над канвасом (#diceLog ниже), иначе высота дока прыгала бы от
       каждого броска. ---- */
    #diceDock {
      flex: 0 0 auto; background: var(--panel-bg); border-top: 1px solid var(--border);
      padding: 7px 10px; font-size: 12px;
    }
    #diceDock.dice-tray { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; }
    #diceDock .dice-buttons { flex: 0 0 auto; }
    #diceDock .dice-pool { flex: 0 0 auto; }
    #diceDock .dice-pool [data-clear] { margin-left: 0; }
    /* Поле формулы не растягиваем на всю оставшуюся ширину: "2d6+3" длиннее
       не становится, а километровый инпут вдоль всего экрана только мешает. */
    #diceDock .dice-custom { flex: 0 1 300px; min-width: 170px; }

    /* Лог бросков — плавающая плашка в левом нижнем углу карты, тем же
       приёмом, что #diceLog у ДМ (см. dm.html): пока броска не было —
       :empty, места не занимает. */
    #diceLog {
      position: absolute; left: 10px; bottom: 10px; z-index: 5; width: 260px; max-height: 180px;
      overflow-y: auto; padding: 8px 10px; border-radius: var(--radius);
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
      display: flex; flex-direction: column-reverse; gap: 2px; opacity: 0.9;
    }
    #diceLog:empty { display: none; }
    #diceLog .dice-log-row { font-size: 11px; }

    /* ---- модалка "Мои персонажи" ---- */
    #charsOverlay {
      display: none; position: fixed; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
    }
    #charsOverlay.open { display: flex; }
    #charsModal {
      width: 420px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px);
      overflow-y: auto; background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      padding: 20px 22px; box-shadow: var(--shadow-float);
    }
    #charsModal h2 { margin: 0 0 14px; font-size: 17px; display: flex; align-items: center; justify-content: space-between; }
    #charsModal h2 button { background: none; border: none; color: var(--text); cursor: pointer; padding: 0; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    #charsModal h2 button:hover { background: var(--surface); }
    .char-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 12px;
      background: var(--surface); margin-bottom: 8px;
    }
    .char-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--surface-hover) center/cover no-repeat;
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-dim);
    }
    .char-name { flex: 1 1 auto; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .char-row button {
      cursor: pointer; padding: 5px 8px; border: none; border-radius: var(--radius); font-size: 11px;
      background: var(--surface-hover); color: var(--text);
    }
    .char-row button:hover { background: #3c3c48; }
    .char-row button.danger { background: var(--danger); }
    .char-row button.danger:hover { background: var(--danger-hover); }

    #charForm { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; }
    #charForm label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
    #charForm input[type="text"] {
      width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); padding: 7px 8px; font-size: 13px; margin-bottom: 10px;
    }
    #charFormButtons { display: flex; gap: 8px; }
    #charFormButtons button {
      cursor: pointer; padding: 7px 12px; border: none; border-radius: var(--radius); font-size: 12px; color: var(--text);
    }
    #charSaveBtn { background: var(--green); }
    #charSaveBtn:hover { background: var(--green-hover); }
    #charCancelEditBtn { background: var(--surface-hover); display: none; }
    #charFormMsg { font-size: 12px; color: #e74c3c; margin-top: 8px; min-height: 14px; }

    /* ---- модалка "Настройки" — та же вёрстка, что "Мои персонажи" ---- */
    #settingsOverlay {
      display: none; position: fixed; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
    }
    #settingsOverlay.open { display: flex; }
    #settingsModal {
      width: 360px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px);
      overflow-y: auto; background: var(--glass-bg-strong); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
      padding: 20px 22px; box-shadow: var(--shadow-float);
    }
    #settingsModal h2 { margin: 0 0 14px; font-size: 17px; display: flex; align-items: center; justify-content: space-between; }
    #settingsModal h2 button { background: none; border: none; color: var(--text); cursor: pointer; padding: 0; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    #settingsModal h2 button:hover { background: var(--surface); }
    #settingsModal .field-block { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    #settingsModal .field-label { opacity: 0.7; }
    #settingsModal .hint { font-size: 12px; opacity: 0.6; margin-top: 12px; }

    #authFailedOverlay {
      display: none; position: fixed; inset: 0; z-index: 50; background: rgba(10,10,14,0.92);
      align-items: center; justify-content: center; text-align: center; color: var(--text); font-size: 14px; padding: 20px;
    }
    #authFailedOverlay.open { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <aside id="sheetDock"></aside>
      <div id="canvasWrap">
        <canvas id="scene"></canvas>
        <div id="topbar">
          <span id="topbarUsername"></span>
          <div id="charDock"></div>
          <div id="combatBarMount"></div>
          <button id="charsBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-4 3.4-6.4 7-6.4s7 2.4 7 6.4"/></svg> Мои персонажи</button>
          <button id="lootHubBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M3 9l2-5h14l2 5"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="9.5" y1="11.5" x2="14.5" y2="11.5"/></svg> Хаб</button>
          <button id="rulerBtn" title="Линейка — ЛКМ и тяни по карте, отпустил — замер исчезает"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="1" transform="rotate(-25 12 12)"/><path d="M6.5 9.7l1 1M9 8l1.2 1.2M11.6 6.4l1 1M14.1 4.6l1.2 1.2" transform="rotate(-25 12 12)"/></svg> Линейка</button>
          <button id="settingsBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg> Настройки</button>
          <button id="logoutBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Выйти</button>
        </div>
        <div id="diceLog"></div>
        <div id="zoomHud">
          <button id="zoomOutBtn" title="Отдалить"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <button id="zoomResetBtn" title="Сбросить вид"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 3 3 3 3 9"/><polyline points="15 21 21 21 21 15"/><line x1="3" y1="3" x2="10" y2="10"/><line x1="21" y1="21" x2="14" y2="14"/></svg></button>
          <button id="zoomInBtn" title="Приблизить"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
      </div>
    </div>
    <div id="diceDock"></div>
  </div>

  <div id="charsOverlay">
    <div id="charsModal">
      <h2><span>Мои персонажи</span><button id="charsCloseBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button></h2>
      <div id="charsList"></div>

      <div id="charForm">
        <label for="charName">Имя персонажа</label>
        <input type="text" id="charName" maxlength="60" placeholder="Теневой Клинок" />
        <label>Аватар / токен-арт (картинка или mp4/webm — анимированный)</label>
        <input type="file" id="charAvatarUpload" accept="image/*,video/mp4,video/webm" />
        <div id="charAvatarPreviewWrap" style="display:none; margin-bottom:10px;">
          <img id="charAvatarPreview" style="width:48px;height:48px;border-radius:50%;object-fit:cover;" />
          <video id="charAvatarPreviewVideo" muted loop autoplay playsinline style="width:48px;height:48px;border-radius:50%;object-fit:cover;display:none;"></video>
        </div>
        <div id="charFormButtons">
          <button id="charSaveBtn" type="button">Создать персонажа</button>
          <button id="charCancelEditBtn" type="button">Отмена</button>
        </div>
        <div id="charFormMsg"></div>
      </div>
    </div>
  </div>

  <div id="settingsOverlay">
    <div id="settingsModal">
      <h2><span>Настройки</span><button id="settingsCloseBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button></h2>
      <div class="field-block">
        <span class="field-label">Версия</span>
        <span id="appVersion">…</span>
      </div>
      <p class="hint">Раздел общих настроек приложения — здесь появятся будущие опции.</p>
    </div>
  </div>

  <div id="authFailedOverlay">
    <div>Сессия истекла или недействительна. Сейчас перекинем на вход…</div>
  </div>

  <script type="module" src="/src/pages/player.js"></script>
</body>
</html>
